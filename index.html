<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <meta name="robots" content="noindex, nofollow">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Mitr', 'sans-serif'] },
                    colors: {
                        cloudBg: '#FFF8FA',
                        softPink: '#FFB7C5',
                        blush: '#FFE3E8',
                        textDark: '#5E4C53',
                        textMuted: '#9B8C92'
                    },
                    boxShadow: {
                        'fluffy': '0 12px 35px -10px rgba(255, 183, 197, 0.3)',
                        'float': '0 20px 40px -10px rgba(255, 183, 197, 0.25)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Mitr', sans-serif;
            background: linear-gradient(135deg, #FFFCFC 0%, #FFF5F7 100%);
            color: #5E4C53;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        
        .page-section { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .page-section.active { display: block; animation: softFadeIn 0.5s ease forwards; }
        
        @keyframes softFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay { display: none; opacity: 0; }
        .modal-overlay.active { display: flex; animation: fadeInModal 0.3s ease forwards; }
        @keyframes fadeInModal { to { opacity: 1; } }
    </style>
</head>
<body class="pb-24">
    <template id="app-tpl">

    <main class="w-full max-w-md md:max-w-3xl lg:max-w-5xl mx-auto px-5 pt-8 relative z-10 pb-10">

        <div id="global-header">
            <div class="flex flex-col items-center text-center mt-2 mb-5">
                <!-- รูปปกร้านค้า -->
                <div class="w-full mb-5 px-1 max-w-3xl mx-auto">
                    <div class="w-full aspect-[2/1] md:aspect-[3/1] lg:aspect-[4/1] bg-white rounded-[2.5rem] shadow-sm border border-blush overflow-hidden relative">
                        <img src="https://placehold.co/800x400/FFE3E8/FFB7C5?text=Shop+Cover" class="w-full h-full object-cover" id="home-shop-cover" alt="Shop Cover">
                    </div>
                </div>
                
                <h1 class="text-2xl font-medium text-textDark mb-1" id="home-shop-name">Mew Mew App</h1>
                <p class="text-textMuted text-xs leading-relaxed max-w-[280px] md:max-w-[400px]" id="home-shop-desc">
                    แอปพรีเมียมราคาถูก ของแท้ 100%<br>ดูแลตลอดการใช้งาน มีประกันทุกชิ้น
                </p>
            </div>
        </div>

        <!-- แถบเมนูปุ๊กปิ๊ก ย้ายออกมาอยู่นอกหน้า เพื่อให้แสดงผลตลอดเวลาทุกหน้า -->
        <div id="main-nav" class="flex justify-center mb-6">
            <nav class="w-fit bg-white/90 backdrop-blur-xl rounded-full shadow-sm py-1 px-1.5 flex justify-center items-center border border-blush gap-1">
                <button onclick="navigate('home')" class="nav-btn px-3 py-1 rounded-full text-[11px] font-medium bg-softPink text-white transition-all flex items-center gap-1" data-target="home">
                    <i class="fas fa-home text-xs"></i> หน้าแรก
                </button>
                <button onclick="navigate('menu')" class="nav-btn px-3 py-1 rounded-full text-[11px] font-medium text-textMuted transition-all flex items-center gap-1 hover:bg-cloudBg" data-target="menu">
                    <i class="fas fa-box-open text-xs"></i> สินค้า
                </button>
                <button onclick="navigate('reviews')" class="nav-btn px-3 py-1 rounded-full text-[11px] font-medium text-textMuted transition-all flex items-center gap-1 hover:bg-cloudBg" data-target="reviews">
                    <i class="fas fa-star text-xs"></i> รีวิว
                </button>
            </nav>
        </div>

        <section id="page-home" class="page-section active">
            <div class="max-w-2xl mx-auto">
                
                <!-- กล่องข้อความและรูปภาพอัปเดต (NOTES) ปรับสัดส่วนบาลานซ์สวยงาม -->
                <div class="mb-8 px-2 max-w-lg mx-auto">
                    <div class="text-[10px] font-extrabold tracking-[0.2em] text-softPink mb-2 ml-4 uppercase">NOTES</div>
                    
                    <div class="flex gap-2.5 items-stretch justify-center h-20">
                        <!-- กล่องข้อความ -->
                        <div class="flex-1 bg-white rounded-[1.5rem] p-3.5 shadow-sm border border-blush/60 flex items-center overflow-y-auto">
                            <p id="home-update-note" class="text-xs text-[#8C7A80] font-medium leading-relaxed w-full break-words text-left"></p>
                        </div>
                        
                        <!-- กล่องรูปภาพเล็ก (สี่เหลี่ยมจัตุรัสบาลานซ์) -->
                        <div class="bg-white rounded-[1.5rem] aspect-square shadow-sm border border-blush/60 p-1 flex items-center justify-center shrink-0 overflow-hidden relative">
                            <img id="home-update-img" src="" class="w-full h-full object-cover rounded-[1.2rem] relative z-10" alt="Update Image" onerror="this.style.display='none'">
                            <span id="home-update-placeholder" class="text-pink-300/60 text-[10px] font-medium absolute z-0 hidden">Pic</span>
                        </div>
                    </div>
                </div>

                <!-- FAQ Section -->
                <div class="mb-8 max-w-lg mx-auto">
                    <div class="flex items-center gap-2 mb-4 pl-2 text-textDark font-medium text-sm justify-center">
                        <i class="fas fa-question-circle text-softPink opacity-70"></i> คำถามที่พบบ่อย (FAQ)
                    </div>
                    <div id="faq-container" class="space-y-3">
                        <!-- FAQs injected here -->
                    </div>
                </div>

                <!-- ช่องทางการติดต่อ (ล่างสุด) ปรับข้อความหัวข้อเป็น Contact ตามสั่ง -->
                <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-blush text-center mt-10 max-w-md mx-auto">
                    <p class="text-sm font-medium text-textDark mb-4 tracking-wider uppercase">Contact</p>
                    <div class="flex flex-col md:flex-row gap-3">
                        <a id="home-link-line" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 w-full bg-[#E8F8EE] text-[#00B900] py-3.5 rounded-2xl text-sm font-medium hover:bg-[#D4F1DF] transition-colors">
                            <i class="fab fa-line text-lg"></i> สั่งซื้อผ่าน LINE
                        </a>
                        <a id="home-link-ig" href="#" target="_blank" class="flex-1 flex items-center justify-center gap-2 w-full bg-blush text-[#E1306C] py-3.5 rounded-2xl text-sm font-medium hover:bg-[#FAD1D8] transition-colors">
                            <i class="fab fa-instagram text-lg"></i> Instagram
                        </a>
                    </div>
                </div>

            </div>
        </section>

        <section id="page-menu" class="page-section">
            
            <div class="text-center mb-6 mt-2">
                <h1 class="text-xl font-medium text-textDark">แคตตาล็อกสินค้า ☁️</h1>
                <p class="text-xs text-textMuted mt-1">ดูราคาแล้วแคปหน้าจอสั่งซื้อได้เลยค่ะ</p>
            </div>

            <!-- Search & Filters -->
            <div class="mb-8 max-w-xl mx-auto">
                <div class="bg-white rounded-full shadow-sm border border-blush flex items-center px-4 py-3 mb-4">
                    <i class="fas fa-search text-softPink opacity-70"></i>
                    <input type="text" id="search-input" placeholder="ค้นหาแอป เช่น Netflix..." class="w-full bg-transparent border-none outline-none text-sm ml-3 text-textDark placeholder-textMuted">
                </div>
                
                <div class="flex overflow-x-auto md:justify-center gap-2 pb-2 hide-scrollbar" id="category-filters">
                    <!-- Categories injected here -->
                </div>
            </div>

            <!-- App Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="app-grid">
                <!-- Apps injected here -->
            </div>

            <!-- ขั้นตอนการสั่งซื้อ (ปรับแต่งได้) -->
            <div class="max-w-2xl mx-auto mt-12 mb-6 bg-white rounded-[2.5rem] p-8 shadow-fluffy text-center relative overflow-hidden border border-blush/40">
                <div class="absolute -top-10 -right-10 w-24 h-24 bg-blush rounded-full opacity-50"></div>
                <h2 class="text-lg font-medium text-softPink mb-6 relative z-10">ขั้นตอนการสั่งซื้อ 🛒</h2>
                
                <div class="space-y-6 relative z-10 text-sm text-textDark">
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blush text-softPink flex items-center justify-center font-medium">1</div>
                        <p id="step-desc-1">เลือกแอปและแคปหน้าจอแพ็กเกจที่สนใจ</p>
                    </div>
                    <div class="w-px h-6 bg-blush mx-auto"></div>
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blush text-softPink flex items-center justify-center font-medium">2</div>
                        <p id="step-desc-2">ไปที่ <b>"หน้าแรก"</b> เพื่อกดปุ่มทักแชต</p>
                    </div>
                    <div class="w-px h-6 bg-blush mx-auto"></div>
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-blush text-softPink flex items-center justify-center font-medium">3</div>
                        <p id="step-desc-3">ส่งรูปให้แอดมิน โอนเงิน และรับรหัสได้เลย ✨</p>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-reviews" class="page-section">
            <div class="text-center mb-8 mt-2">
                <h1 class="text-xl font-medium text-textDark">รีวิวจากลูกค้า 💌</h1>
                <p class="text-xs text-textMuted mt-1">ขอบคุณทุกความไว้วางใจนะคะ</p>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 pb-8" id="review-grid">
                <!-- Reviews injected here -->
            </div>
        </section>

        <section id="page-admin-login" class="page-section">
            <div class="mt-12 flex flex-col items-center justify-center min-h-[50vh]">
                <div class="bg-white rounded-[2.5rem] shadow-fluffy p-8 w-full max-w-sm text-center">
                    <div class="w-16 h-16 bg-blush rounded-full flex items-center justify-center text-softPink text-2xl mx-auto mb-4">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h2 class="text-lg font-medium text-textDark mb-6">ระบบหลังบ้าน</h2>
                    <input type="email" id="admin-email" placeholder="อีเมลแอดมิน" autocomplete="username" class="w-full bg-cloudBg border border-blush rounded-2xl px-4 py-3 mb-3 text-center text-sm outline-none focus:border-softPink transition-colors">
                    <input type="password" id="admin-password" placeholder="รหัสผ่านแอดมิน" autocomplete="current-password" onkeydown="if(event.key==='Enter')loginAdmin()" class="w-full bg-cloudBg border border-blush rounded-2xl px-4 py-3 mb-4 text-center text-sm outline-none focus:border-softPink transition-colors">
                    <button onclick="loginAdmin()" class="w-full bg-softPink text-white rounded-2xl py-3 text-sm font-medium hover:bg-opacity-90 transition-all shadow-sm">เข้าสู่ระบบ</button>
                </div>
            </div>
        </section>

        <section id="page-admin-dashboard" class="page-section">
            <div class="mb-6 bg-white rounded-3xl p-4 shadow-sm flex justify-between items-center border border-blush max-w-3xl mx-auto">
                <div class="flex items-center gap-2 text-textDark font-medium">
                    <div class="w-8 h-8 bg-blush rounded-full flex items-center justify-center text-softPink"><i class="fas fa-cog"></i></div>
                    จัดการข้อมูล
                </div>
                <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-50 text-red-400 font-medium rounded-full text-xs">ออกจากระบบ</button>
            </div>

            <!-- Admin Tabs -->
            <div class="flex flex-wrap gap-2 mb-6 justify-center">
                <button onclick="switchAdminTab('shop', this)" class="admin-tab-btn px-4 py-2 rounded-full text-xs font-medium bg-softPink text-white transition-all">ร้านค้า</button>
                <button onclick="switchAdminTab('apps', this)" class="admin-tab-btn px-4 py-2 rounded-full text-xs font-medium bg-white text-textMuted border border-blush transition-all">สินค้า</button>
                <button onclick="switchAdminTab('reviews', this)" class="admin-tab-btn px-4 py-2 rounded-full text-xs font-medium bg-white text-textMuted border border-blush transition-all">รีวิว</button>
                <button onclick="switchAdminTab('faq', this)" class="admin-tab-btn px-4 py-2 rounded-full text-xs font-medium bg-white text-textMuted border border-blush transition-all">FAQ</button>
            </div>

            <!-- Tab Content -->
            <div class="pb-10 max-w-3xl mx-auto">
                <!-- Shop Tab -->
                <div id="admin-tab-shop" class="admin-panel block bg-white p-6 rounded-[2rem] shadow-sm border border-blush space-y-4">
                    
                    <!-- อัปโหลดรูปปก -->
                    <div class="pb-4 border-b border-blush/30">
                        <label class="text-xs text-textMuted mb-2 block pl-2 font-medium">รูปปกร้านค้า</label>
                        <div class="flex gap-3 items-center pl-2">
                            <img id="edit-shop-cover-preview" src="" class="w-24 h-12 rounded-xl object-cover border border-blush bg-cloudBg">
                            <input type="file" id="upload-cover-img-input" accept="image/*" class="hidden" onchange="handleCoverImgUpload(event)">
                            <button onclick="document.getElementById('upload-cover-img-input').click()" class="bg-blush text-softPink px-4 py-2 rounded-full text-xs font-medium transition-all hover:bg-softPink hover:text-white">เปลี่ยนรูปปก</button>
                            <input type="hidden" id="edit-shop-cover">
                        </div>
                    </div>

                    <div><label class="text-xs text-textMuted mb-1 block pl-2">ชื่อร้าน</label><input type="text" id="edit-shop-name" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none border border-transparent focus:border-blush"></div>
                    <div><label class="text-xs text-textMuted mb-1 block pl-2">คำอธิบาย</label><textarea id="edit-shop-desc" rows="2" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none border border-transparent focus:border-blush resize-none"></textarea></div>
                    
                    <div class="pt-4 mt-2 border-t border-blush/30">
                        <label class="text-xs text-textMuted mb-1 block pl-2 font-medium">กล่องข้อความอัปเดต (NOTES)</label>
                        <textarea id="edit-shop-update-note" rows="2" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none border border-transparent focus:border-blush resize-none" placeholder="เช่น อัปเดต: สต็อก Netflix เข้าแล้ววันนี้ 💖"></textarea>
                    </div>
                    
                    <div class="pb-4 mb-2 border-b border-blush/30">
                        <label class="text-xs text-textMuted mb-2 block pl-2 font-medium">รูปภาพเล็ก (ข้างกล่อง NOTES)</label>
                        <div class="flex gap-3 items-center pl-2">
                            <img id="edit-shop-update-img-preview" src="" class="w-14 h-14 rounded-xl object-cover border border-blush bg-cloudBg">
                            <input type="file" id="upload-update-img-input" accept="image/*" class="hidden" onchange="handleUpdateImgUpload(event)">
                            <button onclick="document.getElementById('upload-update-img-input').click()" class="bg-blush text-softPink px-4 py-2 rounded-full text-xs font-medium transition-all hover:bg-softPink hover:text-white">เลือกรูปภาพใหม่</button>
                            <input type="hidden" id="edit-shop-update-img">
                        </div>
                    </div>

                    <!-- แก้ไขขั้นตอนการสั่งซื้อ -->
                    <div class="pt-2 pb-2 border-t border-blush/30 space-y-3">
                        <label class="text-xs text-textMuted block pl-2 font-medium">แก้ไขขั้นตอนการสั่งซื้อ</label>
                        <div><input type="text" id="edit-step-1" class="w-full bg-cloudBg rounded-xl px-4 py-2 text-xs outline-none border border-transparent focus:border-blush" placeholder="ขั้นตอนที่ 1"></div>
                        <div><input type="text" id="edit-step-2" class="w-full bg-cloudBg rounded-xl px-4 py-2 text-xs outline-none border border-transparent focus:border-blush" placeholder="ขั้นตอนที่ 2"></div>
                        <div><input type="text" id="edit-step-3" class="w-full bg-cloudBg rounded-xl px-4 py-2 text-xs outline-none border border-transparent focus:border-blush" placeholder="ขั้นตอนที่ 3"></div>
                    </div>

                    <div class="pt-2"><label class="text-xs text-textMuted mb-1 block pl-2">ลิงก์สั่งซื้อ LINE</label><input type="text" id="edit-shop-line" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none border border-transparent focus:border-blush"></div>
                    <div><label class="text-xs text-textMuted mb-1 block pl-2">ลิงก์ Instagram</label><input type="text" id="edit-shop-ig" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none border border-transparent focus:border-blush"></div>
                    <button onclick="saveShopInfo()" class="w-full bg-softPink text-white py-3 rounded-2xl text-sm font-medium mt-2 shadow-sm">บันทึกข้อมูล</button>
                </div>

                <!-- Apps Tab -->
                <div id="admin-tab-apps" class="admin-panel hidden bg-white p-6 rounded-[2rem] shadow-sm border border-blush">
                    <button onclick="window.openAppModal(null)" class="w-full bg-blush text-softPink py-3 rounded-2xl text-sm font-medium mb-5 hover:bg-opacity-80">+ เพิ่มแอปใหม่</button>
                    <div id="admin-app-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>

                <!-- Reviews Tab -->
                <div id="admin-tab-reviews" class="admin-panel hidden bg-white p-6 rounded-[2rem] shadow-sm border border-blush">
                    <input type="file" id="upload-review-input" accept="image/*" class="hidden" onchange="window.handleUploadReview(event)">
                    <button onclick="document.getElementById('upload-review-input').click()" class="w-full bg-blush text-softPink py-3 rounded-2xl text-sm font-medium mb-5"><i class="fas fa-image mr-2"></i> เลือกรูปลงรีวิว</button>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="admin-review-list"></div>
                </div>

                <!-- FAQ Tab -->
                <div id="admin-tab-faq" class="admin-panel hidden bg-white p-6 rounded-[2rem] shadow-sm border border-blush">
                    <button onclick="window.openFaqModal(null)" class="w-full bg-blush text-softPink py-3 rounded-2xl text-sm font-medium mb-5">+ เพิ่มคำถาม FAQ</button>
                    <div id="admin-faq-list" class="space-y-3"></div>
                </div>
            </div>
        </section>

        <!-- พรางปุ่ม Admin Login เป็นคำว่า Monali Shop ตามที่คุณต้องการ -->
        <div class="text-center mt-8 pb-4">
            <button onclick="navigate('admin')" class="text-[11px] text-textMuted/40 hover:text-softPink transition-colors tracking-widest font-light">Monali Shop</button>
        </div>

    </main>

    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur-md text-textDark border border-blush px-6 py-3 rounded-full text-sm font-medium opacity-0 pointer-events-none transition-all duration-300 z-[100] shadow-float translate-y-[-10px]">
        <span id="toast-msg" class="flex items-center gap-2"><i class="fas fa-check-circle text-softPink"></i> ข้อความ</span>
    </div>

    <!-- Modal: จัดการสินค้า -->
    <div id="modal-app" class="modal-overlay fixed inset-0 bg-textDark/20 backdrop-blur-sm z-[100] items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] shadow-float w-full max-w-sm flex flex-col max-h-[85vh] overflow-hidden">
            <div class="px-6 py-4 flex justify-between items-center bg-white border-b border-blush">
                <h3 class="font-medium text-textDark" id="modal-app-title">จัดการแอป</h3>
                <button onclick="closeAppModal()" class="w-8 h-8 bg-cloudBg text-textMuted rounded-full flex items-center justify-center text-sm">X</button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow space-y-4 bg-white">
                <input type="hidden" id="modal-app-id">
                
                <div class="flex flex-col items-center mb-4">
                    <div class="relative w-20 h-20 mb-2">
                        <img id="modal-app-img-preview" src="" class="w-full h-full rounded-2xl object-cover bg-cloudBg border border-blush hidden">
                        <div id="modal-app-img-placeholder" class="w-full h-full rounded-2xl bg-cloudBg border border-blush flex items-center justify-center text-textMuted text-xl">
                            <i class="fas fa-image"></i>
                        </div>
                    </div>
                    <input type="file" id="modal-app-img-input" accept="image/*" class="hidden" onchange="handleAppImgUpload(event)">
                    <button onclick="document.getElementById('modal-app-img-input').click()" class="text-xs text-softPink font-medium bg-blush px-3 py-1.5 rounded-full">เลือกรูปโลโก้</button>
                    <input type="hidden" id="modal-app-img">
                </div>

                <div>
                    <label class="text-xs text-textMuted mb-1 block pl-2">ชื่อแอป</label>
                    <input type="text" id="modal-app-name" placeholder="เช่น Netflix" class="w-full bg-cloudBg rounded-2xl px-4 py-2.5 text-sm outline-none">
                </div>
                <div>

        // อัปโหลดรูป (Blob) ไป Storage แล้วคืน public URL
        async function uploadImage(blob, folder, ext) {
            const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
            const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type, cacheControl: '31536000' });
            if (error) throw error;
            return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
        }
        // ย่อรูปด้วย canvas → Blob
        function resizeToBlob(file, max, mime, quality) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onerror = reject;
                r.onload = ev => {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > h && w > max) { h *= max / w; w = max; } else if (h > max) { w *= max / h; h = max; }
                        const c = document.createElement('canvas'); c.width = w; c.height = h;
                        c.getContext('2d').drawImage(img, 0, 0, w, h);
                        c.toBlob(b => b ? resolve(b) : reject(new Error('แปลงรูปไม่สำเร็จ')), mime, quality);
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(file);
            });
        }
        async function uploadResized(file, folder, max, mime, quality) {
            const blob = await resizeToBlob(file, max, mime, quality);
            return uploadImage(blob, folder, mime === 'image/png' ? 'png' : 'jpg');

                    <img src="${r.img}" class="w-full h-full object-cover">
                    <button onclick="deleteReview('${r.id}')" class="absolute inset-0 bg-white/70 backdrop-blur-sm text-red-500 flex items-center justify-center opacity-0 group-hover:opacity-100 font-medium transition-all text-xs">ลบรูปนี้</button>
                </div>
            `).join('');

            document.getElementById('admin-faq-list').innerHTML = state.faqs.map(f => `
                <div class="bg-cloudBg p-4 rounded-2xl flex justify-between items-start border border-blush">
                    <div class="text-xs font-medium text-textDark pr-4 leading-relaxed">${f.q}</div>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="openFaqModal(${f.id})" class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-textMuted hover:text-softPink transition-colors"><i class="fas fa-pen text-[10px]"></i></button>
                        <button onclick="deleteFaq(${f.id})" class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-textMuted hover:text-red-400 transition-colors"><i class="fas fa-trash text-[10px]"></i></button>
                    </div>
                </div>
            `).join('');
        }

        async function saveShopInfo() {
            const shop = {
                name: document.getElementById('edit-shop-name').value,
                desc: document.getElementById('edit-shop-desc').value,
                line: document.getElementById('edit-shop-line').value,
                ig: document.getElementById('edit-shop-ig').value,
                coverImage: document.getElementById('edit-shop-cover').value,
                updateNote: document.getElementById('edit-shop-update-note').value,
                updateImage: document.getElementById('edit-shop-update-img').value,
                steps: [
                    document.getElementById('edit-step-1').value,
                    document.getElementById('edit-step-2').value,
                    document.getElementById('edit-step-3').value
                ]
            };
            try {
                await q(sb.from('shop_settings').upsert({
                    id: 1, name: shop.name, description: shop.desc, line_url: shop.line, ig_url: shop.ig,
                    cover_image: shop.coverImage, update_note: shop.updateNote, update_image: shop.updateImage, steps: shop.steps
                }));
                state.shop = shop;
                renderApp(); showToast('บันทึกข้อมูลร้านแล้ว 🤍');
            } catch (e) { fail(e); }
        }

        window.openAppModal = function(id) {
            const modal = document.getElementById('modal-app');
            document.getElementById('modal-app-packages').innerHTML = '';
            
            if (id) {
                const app = state.apps.find(a => a.id === id);
                document.getElementById('modal-app-title').textContent = "แก้ไขแอป";
                document.getElementById('modal-app-id').value = app.id;
                document.getElementById('modal-app-name').value = app.name;
                document.getElementById('modal-app-cat').value = app.category;
                
                document.getElementById('modal-app-img').value = app.img;
                if(app.img) {
                    document.getElementById('modal-app-img-preview').src = app.img;
                    document.getElementById('modal-app-img-preview').classList.remove('hidden');
                    document.getElementById('modal-app-img-placeholder').classList.add('hidden');
                } else {
                    document.getElementById('modal-app-img-preview').classList.add('hidden');
                    document.getElementById('modal-app-img-placeholder').classList.remove('hidden');
                }
                
                app.packages.forEach(p => window.addPackageRow(p.name, p.duration, p.price));
            } else {
                document.getElementById('modal-app-title').textContent = "เพิ่มแอปใหม่";
                document.getElementById('modal-app-id').value = ""; document.getElementById('modal-app-name').value = "";
                document.getElementById('modal-app-cat').value = "ทั่วไป"; document.getElementById('modal-app-img').value = "";
                
                document.getElementById('modal-app-img-preview').classList.add('hidden');
                document.getElementById('modal-app-img-placeholder').classList.remove('hidden');
                
                window.addPackageRow();
            }
            modal.classList.add('active');
        };
        window.closeAppModal = () => document.getElementById('modal-app').classList.remove('active');
        
        window.addPackageRow = function(name = "", duration = "", price = "") {
            // ป้องกันเบราว์เซอร์ส่ง Event Object เข้ามาแทนข้อความเมื่อเรียกใช้จาก HTML onclick
            if (typeof name !== 'string') name = "";
            if (typeof duration !== 'string') duration = "";
            if (typeof price !== 'number' && typeof price !== 'string') price = "";

            const row = document.createElement('div'); row.className = "flex gap-2 items-center pkg-row mb-2";
            row.innerHTML = `
                <input type="text" value="${name}" placeholder="แพ็กเกจ" class="w-[35%] bg-cloudBg rounded-xl px-3 py-2 text-xs outline-none focus:border focus:border-blush">
                <input type="text" value="${duration}" placeholder="เวลา" class="w-[30%] bg-cloudBg rounded-xl px-3 py-2 text-xs outline-none focus:border focus:border-blush">
                <input type="number" value="${price}" placeholder="ราคา" class="w-[25%] bg-cloudBg rounded-xl px-3 py-2 text-xs outline-none focus:border focus:border-blush">
                <button onclick="this.parentElement.remove()" class="w-[10%] text-textMuted hover:text-red-400 font-medium flex justify-center"><i class="fas fa-times"></i></button>
            `;
            document.getElementById('modal-app-packages').appendChild(row);
        };

        window.saveAppModal = async function() {
            const name = document.getElementById('modal-app-name').value;
            if(!name) { showToast('กรุณาใส่ชื่อแอปด้วยนะคะ'); return; }

            const id = document.getElementById('modal-app-id').value;
            const category = (document.getElementById('modal-app-cat').value || 'ทั่วไป').trim();
            const img = document.getElementById('modal-app-img').value;
            const packages = [];
            document.querySelectorAll('.pkg-row').forEach(row => {
                const i = row.querySelectorAll('input');
                if(i[0].value && i[2].value) packages.push({ name: i[0].value, duration: i[1].value, price: Number(i[2].value) });
            });

            try {
                // หมวดหมู่: สร้างถ้ายังไม่มี
                let cat = await q(sb.from('categories').select('id').eq('name', category).maybeSingle());
                if (!cat) {
                    cat = await q(sb.from('categories').insert({ name: category, sort_order: state.categories.length }).select('id').single());
                }
                let appId;
                if (id) {
                    appId = parseInt(id);
                    await q(sb.from('apps').update({ name, category_id: cat.id, img }).eq('id', appId));
                    await q(sb.from('packages').delete().eq('app_id', appId));
                } else {
                    const maxOrder = state.apps.length + 1;
                    const row = await q(sb.from('apps').insert({ name, category_id: cat.id, img, sort_order: maxOrder }).select('id').single());
                    appId = row.id;
                }
                if (packages.length) {
                    await q(sb.from('packages').insert(packages.map((p, i) => ({ ...p, app_id: appId, sort_order: i + 1 }))));
                }
                closeAppModal();
                await loadAll();
                showToast('บันทึกแอปเรียบร้อย ✨');
            } catch (e) { fail(e); }
        };
        window.deleteApp = async id => {
            try { await q(sb.from('apps').delete().eq('id', id)); await loadAll(); showToast('ลบแอปแล้วค่ะ'); }
            catch (e) { fail(e); }
        };

        window.handleCoverImgUpload = async function(e) {
            const file = e.target.files[0]; if(!file) return;
            e.target.value = '';
            try {
                showToast('กำลังอัปโหลดรูป...');
                const url = await uploadResized(file, 'cover', 900, 'image/jpeg', 0.85);
                document.getElementById('edit-shop-cover').value = url;
                document.getElementById('edit-shop-cover-preview').src = url;
            } catch (err) { fail(err); }
        };

        window.handleAppImgUpload = async function(e) {
            const file = e.target.files[0]; if(!file) return;
            e.target.value = '';
            try {
                showToast('กำลังอัปโหลดรูป...');
                const url = await uploadResized(file, 'apps', 200, 'image/png');
                document.getElementById('modal-app-img').value = url;
                document.getElementById('modal-app-img-preview').src = url;
                document.getElementById('modal-app-img-preview').classList.remove('hidden');
                document.getElementById('modal-app-img-placeholder').classList.add('hidden');
            } catch (err) { fail(err); }
        };

        window.handleUpdateImgUpload = async function(e) {
            const file = e.target.files[0]; if(!file) return;
            e.target.value = '';
            try {
                showToast('กำลังอัปโหลดรูป...');
                const url = await uploadResized(file, 'notes', 300, 'image/png');
                document.getElementById('edit-shop-update-img').value = url;
                document.getElementById('edit-shop-update-img-preview').src = url;
            } catch (err) { fail(err); }
        };

        window.handleUploadReview = async function(e) {
            const file = e.target.files[0]; if(!file) return;
            e.target.value = '';
            try {
                showToast('กำลังอัปโหลดรูป...');
                const url = await uploadResized(file, 'reviews', 600, 'image/jpeg', 0.8);
                await q(sb.from('reviews').insert({ img: url }));
                await loadAll(); showToast('อัปโหลดรูปรีวิวแล้ว 📸');
            } catch (err) { fail(err); }
        };
        window.deleteReview = async id => {
            try { await q(sb.from('reviews').delete().eq('id', id)); await loadAll(); showToast('ลบรูปรีวิวแล้วค่ะ'); }
            catch (e) { fail(e); }
        };

        window.openFaqModal = function(id) {
            if(id) {
                const f = state.faqs.find(x => x.id === id);
                document.getElementById('modal-faq-id').value = f.id; 
                document.getElementById('modal-faq-q').value = f.q; document.getElementById('modal-faq-a').value = f.a;
            } else {
                document.getElementById('modal-faq-id').value = ""; 
                document.getElementById('modal-faq-q').value = ""; document.getElementById('modal-faq-a').value = "";
            }
            document.getElementById('modal-faq').classList.add('active');
        };
        window.closeFaqModal = () => document.getElementById('modal-faq').classList.remove('active');
        window.saveFaqModal = async function() {
            const id = document.getElementById('modal-faq-id').value, question = document.getElementById('modal-faq-q').value;
            if(!question) return;
            const answer = document.getElementById('modal-faq-a').value;
            try {
                if (id) await q(sb.from('faqs').update({ question, answer }).eq('id', parseInt(id)));
                else await q(sb.from('faqs').insert({ question, answer, sort_order: state.faqs.length + 1 }));
                closeFaqModal(); await loadAll(); showToast('บันทึก FAQ แล้ว ❓');
            } catch (e) { fail(e); }
        };
        window.deleteFaq = async id => {
            try { await q(sb.from('faqs').delete().eq('id', id)); await loadAll(); showToast('ลบ FAQ แล้วค่ะ'); }
            catch (e) { fail(e); }
        };

        // ค้นหารูปจาก ID แทนการพ่น Base64 ลงใน HTML ตรงๆ เพื่อป้องกันเบราว์เซอร์หน่วงและ Error
        window.openImageViewerById = function(id) {
            const review = state.reviews.find(x => String(x.id) === String(id));
            if (review && review.img) {
                document.getElementById('viewer-image').src = review.img;
                document.getElementById('modal-image-viewer').classList.add('active');
            }
        };
        
        window.closeImageViewer = function() {
            document.getElementById('modal-image-viewer').classList.remove('active');
        };

        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            if(link && link.getAttribute('href') === '#') e.preventDefault();
        });

        window.addEventListener('DOMContentLoaded', async () => { 
            document.querySelector('.nav-btn[data-target="home"]').classList.add('bg-softPink', 'text-white', 'shadow-sm');
            document.querySelector('.nav-btn[data-target="home"]').classList.remove('text-textMuted', 'hover:bg-cloudBg');
            renderApp();
            await loadAll();
            // กู้คืนเซสชันแอดมิน (ถ้าเคยล็อกอินไว้)
            const { data: { session } } = await sb.auth.getSession();
            if (session) { const { data: ok } = await sb.rpc('is_admin'); if (ok) state.isAdminAuth = true; }
        });
    </script>
</body>
</html>
